<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Agentic Workshop · Links</title>
<meta name="description" content="Everything from the Agentic Workshop at Sui Basecamp 2026: the slides, the tutorial repository, and BIAR on X." />
<meta name="color-scheme" content="dark" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23f28b57'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  body { overflow: auto; }
  .lk { min-height: 100dvh; display: grid; align-content: center; gap: 30px; max-width: 460px; margin: 0 auto; padding: 48px 22px 56px; position: relative; z-index: 2; }
  .lk-head { text-align: center; }
  .lk-mark { display: inline-flex; align-items: center; gap: 9px; font: 500 11px var(--mono); letter-spacing: var(--label-ls); text-transform: uppercase; color: var(--ink-3); border: 0; }
  .lk-mark:hover { color: var(--ink); }
  .lk-mark i { width: 9px; height: 9px; border-radius: 999px; background: var(--grad); box-shadow: 0 0 14px var(--accent); }
  .lk-head h1 { font-family: var(--display); font-size: clamp(30px, 9vw, 40px); margin: 18px 0 10px; }
  .lk-head p { color: var(--ink-3); font: 11px var(--mono); letter-spacing: .06em; margin: 0; line-height: 1.7; }
  .lk-list { display: grid; gap: 12px; }
  /* full-width rows: a thumb should not have to aim on a phone */
  .lk-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg-2); color: var(--ink); }
  .lk-row:hover, .lk-row:focus-visible { border-color: var(--accent); color: var(--ink); }
  .lk-row b { display: block; font: 600 16px var(--sans); letter-spacing: -0.01em; }
  .lk-row span { display: block; color: var(--ink-3); font: 11px var(--mono); letter-spacing: .05em; margin-top: 5px; }
  .lk-row i { font-style: normal; color: var(--accent); font-size: 17px; }
  .lk-note { text-align: center; color: var(--ink-3); font: 11px var(--mono); letter-spacing: .05em; min-height: 16px; }
  .lk-note[data-joined] { color: var(--accent-2); }
</style>
</head>
<body>

<div class="ambient" aria-hidden="true"></div>

<main class="lk">
  <div class="lk-head">
    <a class="lk-mark" href="/"><i></i>agentic workshop</a>
    <h1>From binary to agents.</h1>
    <p>Sui Basecamp 2026 · Marina Bay Sands<br />Singapore · Oct 7–8</p>
  </div>

  <nav class="lk-list" aria-label="Workshop links">
    <a class="lk-row" href="/">
      <span><b>The slides</b><span>Follow along with the workshop</span></span>
      <i aria-hidden="true">→</i>
    </a>
    <a class="lk-row" href="https://github.com/justbiar/suibasecamp" target="_blank" rel="noopener noreferrer">
      <span><b>The tutorial</b><span>Build the agent yourself · GitHub</span></span>
      <i aria-hidden="true">↗</i>
    </a>
    <a class="lk-row" href="https://x.com/justbiar" target="_blank" rel="noopener noreferrer">
      <span><b>BIAR on X</b><span>@justbiar</span></span>
      <i aria-hidden="true">↗</i>
    </a>
    <a class="lk-row" href="/agents">
      <span><b>Agent directory</b><span>Agents registered on Sui testnet</span></span>
      <i aria-hidden="true">→</i>
    </a>
  </nav>

  <p class="lk-note" id="lkNote" role="status"></p>
</main>

<script src="links.js"></script>
</body>
</html>
